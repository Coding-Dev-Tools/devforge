name: Link Check
on:
  pull_request:
    paths:
      - '**.html'
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run link checker
        run: python .hermes/linkcheck.py
