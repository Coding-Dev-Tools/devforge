name: Branding Protection
on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'CNAME'
      - '.github/workflows/static.yml'
      - '.github/workflows/pages.yml'
jobs:
  check-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Check for unauthorized branding changes
        env:
          PR_LABELS: "${{ join(github.event.pull_request.labels.*.name, ',') }}"
        run: |
          if echo "$PR_LABELS" | grep -q "BRANDING-APPROVED"; then
            echo "BRANDING-APPROVED label present. Allowing changes."
            exit 0
          fi
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }} HEAD)
          for file in $CHANGED_FILES; do
            case "$file" in
              *.html|*.css|*.js|CNAME)
                echo "::error::Branding change detected in $file without BRANDING-APPROVED label"
                echo "Add the BRANDING-APPROVED label to this PR to allow branding changes."
                exit 1
                ;;
            esac
          done
          echo "No unauthorized branding changes detected."
