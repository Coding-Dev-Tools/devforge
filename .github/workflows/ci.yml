name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pytest pyyaml beautifulsoup4
      - name: Run test suite
        run: python -m pytest tests/ -q

  linkcheck:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . || pip install requests
      - name: Run link checker
        run: python .hermes/linkcheck.py --exit-code --verbose .

  html-validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@6f62a310ddc3c79a97ec2ba0f85253a5ea356688 # v7.2.0
        with:
          config: .github/html5validator.yml

  pages-artifact:
    name: Pages Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build allowlisted Pages artifact
        run: python scripts/build_pages_artifact.py --source . --output dist/pages

  cli-example-smoke:
    name: CLI Example Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the documented CLI tools
        run: >-
          pip install pytest pyyaml
          git+https://github.com/Coding-Dev-Tools/api-contract-guardian.git
          git+https://github.com/Coding-Dev-Tools/json2sql.git
          git+https://github.com/Coding-Dev-Tools/deploydiff.git
          git+https://github.com/Coding-Dev-Tools/configdrift.git
          git+https://github.com/Coding-Dev-Tools/deadcode.git
      - name: Exercise rendered CI examples with dummy data
        env:
          DEVFORGE_UPSTREAM_SMOKE: '1'
        run: python -m pytest tests/test_ci_examples.py -q

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, linkcheck, html-validate, pages-artifact, cli-example-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0
      - name: Build allowlisted Pages artifact
        run: python scripts/build_pages_artifact.py --source . --output dist/pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
